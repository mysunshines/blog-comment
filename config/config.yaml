app:
  name: comment-service
  env: development
  log_dir: ./logs
  log_level: info

grpc:
  host: 0.0.0.0
  port: 9003

http:
  host: 0.0.0.0
  port: 8083

database:
  host: localhost
  port: 3306
  user: root
  password: ""
  name: blog
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 100

jwt:
  secret: your-secret-key
  expire_time: 86400

consul:
  address: localhost:8500
  check_interval: 10
  deregister_critical: 30

metrics:
  enabled: true
  path: /metrics
  port: 9093

user_service:
  host: localhost
  port: 9090
